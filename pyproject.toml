[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "messie"
version = "0.1.0"
description = "Notices when a folder has become a mess. Local only, no external services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# wordllama carries its own weights inside the wheel, so a plain install is
# fully offline and always has a backend.
dependencies = ["numpy>=1.24", "wordllama>=0.4"]

[project.optional-dependencies]
# There are no alternative-backend extras. model2vec and sentence-transformers
# were both carried here once; measurement found neither beat wordllama where
# messie operates, and see messie/embed/__init__.py for the numbers.
#
# Reads EXIF, so photographs, scans and screenshots name themselves rather
# than being three sets of numbers. Images still report their dimensions
# without it.
photos = ["pillow>=10.0"]
pdf = ["pypdf>=4.0"]
all = ["pypdf>=4.0", "pillow>=10.0"]
dev = ["pytest>=7.4", "ruff>=0.4", "pypdf>=4.0"]

[project.scripts]
messie = "messie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The corpus modules hold verbatim file bodies — log lines, source code, YAML.
# Wrapping them to suit the Python source would distort the data under test.
"tests/corpus/office.py" = ["E501"]
"tests/corpus/dev.py" = ["E501"]
"tests/corpus/personal.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
