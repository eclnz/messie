[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "messie"
version = "0.1.0"
description = "Notices when a folder has become a mess. Local only, no external services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "wordllama>=0.4"]

[project.optional-dependencies]
photos = ["pillow>=10.0"]
pdf = ["pypdf>=4.0"]
all = ["pypdf>=4.0", "pillow>=10.0"]
dev = ["pytest>=7.4", "ruff>=0.4", "pypdf>=4.0"]

[project.scripts]
messie = "messie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/corpus/office.py" = ["E501"]
"tests/corpus/dev.py" = ["E501"]
"tests/corpus/personal.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pyright]
extraPaths = ["src", "tests", "scripts"]

